# Render Blueprint for Panorama (frontend + backend + cron + Postgres)
#
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy flow:
# 1. Deploy Blueprint (services will start with empty/placeholder vars).
# 2. In Dashboard, add AWS_*, etc. to the "panorama-secrets" env group.
# 3. Backend and cron jobs use fromGroup - no need to set vars on backend directly.
# 4. Frontend → Environment: add VITE_URL and VITE_API_URL (backend URL).
# 5. Redeploy backend and frontend.
#
# NOTE: If you use an existing env group, set its name to "panorama-secrets"
# or change fromGroup below to match your group name. fromService does NOT
# see variables from env groups - cron jobs must use fromGroup.

envVarGroups:
  - name: panorama-secrets
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      # Optional but recommended when multiple deployments share one bucket.
      # Set a unique value per deployment/client, e.g. client-a, client-b.
      - key: MEDIA_KEY_PREFIX
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: METALS_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PRELUDE_API_KEY
        sync: false
      - key: PRELUDE_TEMPLATE_ID
        sync: false
      - key: PRELUDE_SENDER
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false

databases:
  - name: db
    plan: free
    region: oregon  # Must match backend/cron region for internal URL to resolve

services:
  # Django API
  - type: web
    name: backend
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: python check_startup.py && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 --keep-alive 5 --access-logfile - --error-logfile - --log-level info --preload
    healthCheckPath: /health/
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: "0"
      - key: PRELUDE_BASE_URL
        value: https://api.prelude.dev
      # All secrets from env group (add values in Dashboard → panorama-secrets)
      - fromGroup: panorama-secrets

  # Vite static site
  - type: web
    name: frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Add after first deploy: backend URL (e.g. https://backend-xxxx.onrender.com)
      # Render cannot use fromService with RENDER_EXTERNAL_URL.
      - key: VITE_URL
        sync: false
      - key: VITE_API_URL
        sync: false

  # Scheduled price refresh (short-lived Django management command)
  - type: cron
    name: refresh-prices
    runtime: python
    region: oregon
    rootDir: backend
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py refresh_external_asset_prices --scope product-assets --limit 50 --min-age-seconds 240
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString

      # Match Django SECRET_KEY used by the web service
      - key: SECRET_KEY
        fromService:
          type: web
          name: backend
          envVarKey: SECRET_KEY
      - key: PRELUDE_BASE_URL
        value: https://api.prelude.dev
      # All secrets from env group (same as backend)
      - fromGroup: panorama-secrets

  # Process positions: open/close scheduled positions, create interest transactions
  - type: cron
    name: process-positions
    runtime: python
    region: oregon
    rootDir: backend
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py process_positions
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString

      - key: SECRET_KEY
        fromService:
          type: web
          name: backend
          envVarKey: SECRET_KEY
      - key: PRELUDE_BASE_URL
        value: https://api.prelude.dev
      # All secrets from env group (same as backend)
      - fromGroup: panorama-secrets

