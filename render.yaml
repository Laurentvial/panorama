# Render Blueprint for Panorama (frontend + backend + cron + Postgres)
#
# Docs: https://render.com/docs/blueprint-spec
#
# Notes:
# - The backend requires Cloudinary credentials at runtime (see env vars below).
# - The frontend reads the backend URL from Vite env vars at build time.

databases:
  - name: db
    plan: free

services:
  # Django API
  - type: web
    name: backend
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: python check_startup.py && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 --keep-alive 5 --access-logfile - --error-logfile - --log-level info --preload
    healthCheckPath: /health/
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: "0"

      # Required for media storage (backend will fail-fast if missing)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Optional integrations
      - key: GEMINI_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      # Email (client platform)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # SMS OTP (client platform)
      - key: INFOBIP_BASE_URL
        sync: false
      - key: INFOBIP_API_KEY
        sync: false
      - key: INFOBIP_SENDER
        sync: false
      - key: FRONTEND_PUBLIC_URL
        fromService:
          type: web
          name: frontend
          envVarKey: RENDER_EXTERNAL_URL

  # Vite static site
  - type: web
    name: frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Use the backend's public URL (browser must be able to reach it).
      # Using `property: host` can yield an internal hostname (e.g. backend-xxxx)
      # which is not reachable from the user's browser.
      - key: VITE_URL
        fromService:
          type: web
          name: backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_URL
        fromService:
          type: web
          name: backend
          envVarKey: RENDER_EXTERNAL_URL

  # Scheduled price refresh (short-lived Django management command)
  - type: cron
    name: refresh-prices
    runtime: python
    region: oregon
    rootDir: backend
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py refresh_external_asset_prices --scope product-assets --limit 20 --min-age-seconds 240
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString

      # Match Django SECRET_KEY used by the web service
      - key: SECRET_KEY
        fromService:
          type: web
          name: backend
          envVarKey: SECRET_KEY

      # Reuse backend secrets (set them once on backend)
      - key: CLOUDINARY_CLOUD_NAME
        fromService:
          type: web
          name: backend
          envVarKey: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
        fromService:
          type: web
          name: backend
          envVarKey: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
        fromService:
          type: web
          name: backend
          envVarKey: CLOUDINARY_API_SECRET

      # Optional integrations (also reuse backend values if set)
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: backend
          envVarKey: GEMINI_API_KEY
      - key: ALPHA_VANTAGE_API_KEY
        fromService:
          type: web
          name: backend
          envVarKey: ALPHA_VANTAGE_API_KEY
      - key: FINNHUB_API_KEY
        fromService:
          type: web
          name: backend
          envVarKey: FINNHUB_API_KEY
      - key: NEWS_API_KEY
        fromService:
          type: web
          name: backend
          envVarKey: NEWS_API_KEY
      # Email (not used by cron, but keep env parity)
      - key: RESEND_API_KEY
        fromService:
          type: web
          name: backend
          envVarKey: RESEND_API_KEY
      - key: RESEND_FROM_EMAIL
        fromService:
          type: web
          name: backend
          envVarKey: RESEND_FROM_EMAIL
      - key: FRONTEND_PUBLIC_URL
        fromService:
          type: web
          name: backend
          envVarKey: FRONTEND_PUBLIC_URL
      - key: INFOBIP_BASE_URL
        fromService:
          type: web
          name: backend
          envVarKey: INFOBIP_BASE_URL
      - key: INFOBIP_API_KEY
        fromService:
          type: web
          name: backend
          envVarKey: INFOBIP_API_KEY
      - key: INFOBIP_SENDER
        fromService:
          type: web
          name: backend
          envVarKey: INFOBIP_SENDER

